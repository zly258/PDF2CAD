[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2cad"
version = "1.0.0"
description = "打印 PDF 图纸转 DXF：智能识别与原生重绘引擎（中文零乱码 / GBK + gbcbig.shx）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0" }
authors = [{ name = "zhangly1403", email = "zhangly1403@gmail.com" }]
keywords = ["PDF", "DXF", "CAD", "OCR", "矢量转换", "工程图纸"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Conversion",
]

# 运行期必需依赖：解析 + 内置 OCR（RapidOCR）+ wxPython 极简 GUI + LLM（标准库 urllib，无额外依赖）
# opencv 用 headless 变体：本程序只用 cv2 的图像算法（threshold/findContours/HoughCircles/
# polylines 等），不需要 GUI/视频后端，可省掉 ffmpeg 等约 30 MB。
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pdfplumber>=0.10",
    "pypdf>=3.9",
    "rapidocr-onnxruntime>=1.3,<2",
    "wxPython>=4.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# 百度 PaddleOCR（--ocr paddleocr，中文工程图纸识别率更高）。
# 体积大（含 paddlepaddle），故为可选；未安装时该模式自动退回 RapidOCR。
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.5"]
# 打包 exe 所需（不随普通安装拉取）
build = ["pyinstaller>=6.0"]
dev = ["pyinstaller>=6.0", "pyflakes>=3.0"]

[project.scripts]
pdf2cad = "pdf2cad.cli:main"

[project.gui-scripts]
pdf2cad-gui = "pdf2cad.cli:main"

[project.urls]
Homepage = "https://example.com/pdf2cad"

[tool.setuptools]
packages = [
    "pdf2cad",
    "pdf2cad.core",
    "pdf2cad.ocr",
    "pdf2cad.ui",
]
include-package-data = true

